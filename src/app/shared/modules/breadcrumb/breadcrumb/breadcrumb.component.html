<nav *ngIf="breadcrumb !== undefined" aria-label="breadcrumb">
  <ol class="breadcrumb">
      <li class="breadcrumb-item" *ngFor="let link of breadcrumb.previous">
          <a (click)="goto(link.fullPath)" mat-button > {{link.name}} </a>
      </li>
      <li class="breadcrumb-item active" aria-current="page">
          <a mat-button disabled>{{ breadcrumb.name }}</a>
      </li>
  </ol>
</nav>
<div *ngIf="breadcrumb !== undefined" class="col-12">
  <div class="text-center mat-headline-1 pt-3">{{ breadcrumb.name }}</div>
  <h1 class="text-center pt-3">{{ breadcrumb.name }}</h1>
  <h2 class="text-center pt-3">{{ breadcrumb.name }}</h2>
  <h3 class="text-center pt-3">{{ breadcrumb.name }}</h3>
  <h4 class="text-center pt-3">{{ breadcrumb.name }}</h4>
  <h5 class="text-center pt-3">{{ breadcrumb.name }}</h5>
  <h6 class="text-center pt-3">{{ breadcrumb.name }}</h6>
  <hr class="pb-4">
</div>
